# infra/docker-compose.yml
#
# Shared monitoring infrastructure: Prometheus + Grafana.
# Start this ONCE. All three projects connect to the 'monitoring' network it creates.
#
# Start:  docker compose up -d
# Stop:   docker compose down        (keeps volumes — your dashboards survive)
# Wipe:   docker compose down -v     (deletes volumes — fresh Grafana state)

services:

  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      # Mount the infra/ DIRECTORY, not just the file. Many editors save by writing a
      # new file and renaming it over the old one; a single-file bind mount would keep
      # showing Prometheus the OLD file, so /-/reload would silently change nothing.
      # A directory mount always shows the current file. Prometheus only reads
      # /etc/prometheus/prometheus.yml from it.
      - ./:/etc/prometheus:ro
      - promdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # --web.enable-lifecycle lets you reload config with a POST request
      # instead of restarting the container. Used in each project's CONNECT.md.
      - "--web.enable-lifecycle"
      # NOTE: Prometheus 3.x no longer ships the web console templates, so the
      # old --web.console.libraries / --web.console.templates flags are gone.
      # Passing them on 3.x makes the container exit on startup.
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:13.0.1
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafdata:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - monitoring

volumes:
  promdata:
  grafdata:

networks:
  monitoring:
    # name: monitoring creates the network with EXACTLY this name.
    # Without this, Docker would call it "infra_monitoring" and the
    # external: true reference in each project's Compose file would fail.
    name: monitoring
    driver: bridge

  # ---------------------------------------------------------------------------
  # Apps that run natively (not in Docker) cannot be reached by container name.
  # They are scraped by the native Prometheus from wsl-setup/ / linux-setup/ /
  # mac-setup/ — add their jobs to that prometheus.yml, not here.
  # ---------------------------------------------------------------------------
